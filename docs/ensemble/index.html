<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Ensembles — Cadence</title>
<meta name="description" content="Cadence Ensemble — the private home base for marching arts organizations: announcements, groups, chat, calendar, files and operations.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a3f6b">
<link rel="icon" href="../icons/icon-192.png">
<script>(function(){var r=document.documentElement;var t=localStorage.getItem("cad-theme");if(t)r.dataset.theme=t;
var fs=localStorage.getItem("cad-fontsize");if(fs&&fs!=="1")r.style.zoom=fs;})();</script>
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="ensemble.css">
</head>
<body class="ens">
<div id="ensShell"></div>
<main id="ensMain" class="viz-root">
  <div class="loading">Loading…</div>
</main>

<script src="../vendor/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script src="../account.js"></script>
<script src="../analytics.js"></script>
<script src="core.js"></script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("ensMain");
  var esc = CadOrg.esc;

  var TYPES = [
    ["marching_band", "Marching band"], ["drum_corps", "Drum corps"],
    ["winter_guard", "Winter guard"], ["indoor_percussion", "Indoor percussion"],
    ["wgi_guard", "WGI color guard"], ["wgi_percussion", "WGI percussion"],
    ["wgi_winds", "WGI winds"], ["concert_band", "Concert band program"],
    ["school_music", "School music program"], ["booster", "Booster organization"],
    ["independent", "Independent ensemble"],
  ];

  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48);
  }

  /* ── invite deep links ────────────────────────────────────────────────
     A copied invite link lands here as ?invite=CODE (people.js inviteUrl);
     the notification worker used to email ?join=CODE, so accept both — the
     links already out in the wild have to keep working.

     We prefill the box and never redeem on load. redeem_org_invite is a
     real state change (it burns a use and enrols the signed-in account), so
     a link forwarded to the wrong group chat, or prefetched by a mail
     client, must not quietly sign someone into a workspace. One tap on
     "Join workspace" is the consent, and nothing on this page is focused
     for you — a stray Enter or Space must never accept an invitation. */
  var INVITE_KEY = "cad-pending-invite";
  /* A parked code only has to outlive one magic-link round trip, and the
     link itself expires in about an hour, so the park does too. */
  var INVITE_TTL = 60 * 6e4; // 1 hour

  function inviteFromUrl(search) {
    var q;
    try { q = new URLSearchParams(search); } catch (e) { return ""; }
    return String(q.get("invite") || q.get("join") || "").trim();
  }

  function normEmail(v) { return String(v == null ? "" : v).trim().toLowerCase(); }

  /* Signing in bounces through a magic link, and account.js sends the user
     back to location.pathname with the query string stripped — so park the
     code for that round trip and consume it once.

     An invite code is a bearer token: whoever holds it can burn a use and
     enrol themselves. So the park is stamped with the address the sign-in
     link was mailed to, and handed back only to a session signed in as that
     same address. On a family laptop, a code one person left parked is
     never quietly loaded into the next person's box. */
  function parkInvite(code, email) {
    var who = normEmail(email);
    if (!code || !who) return;
    try {
      localStorage.setItem(INVITE_KEY,
        JSON.stringify({ code: code, at: Date.now(), email: who }));
    } catch (e) {}
  }

  function takeParkedInvite(email) {
    var raw = null;
    try { raw = localStorage.getItem(INVITE_KEY); localStorage.removeItem(INVITE_KEY); } catch (e) {}
    if (!raw) return "";
    var who = normEmail(email);
    try {
      var v = JSON.parse(raw);
      if (!v || !v.code) return "";
      if (Date.now() - (v.at || 0) >= INVITE_TTL) return "";      // link is dead by now
      if (!who || normEmail(v.email) !== who) return "";          // not the person who asked
      return String(v.code);
    } catch (e) { return ""; }
  }

  // read at boot, before the sign-in gate can take the page over
  var pendingInvite = inviteFromUrl(location.search);

  /* Signed out with an invite in hand: core.js has mounted its magic-link
     gate. Park the code against whatever address they ask the link to be
     sent to, so it comes back to them and to nobody else on this browser.
     If the gate ever stops using these ids the park simply never happens —
     the code box just starts empty (scripts/test_invite_links.js watches
     core.js for exactly that drift). */
  function parkOnSignIn() {
    var f = document.getElementById("ensSignIn");
    if (!f) return;
    f.addEventListener("submit", function () {
      var input = document.getElementById("ensEmail");
      parkInvite(pendingInvite, input && input.value);
    });
  }

  function card(r) {
    var o = r.org, days = CadOrg.trialDaysLeft(o);
    var badge = o.status === "trialing"
      ? '<span class="ens-tag important">Trial · ' + (days > 0 ? days + "d left" : "expired") + "</span>"
      : CadOrg.isWritable(o) ? '<span class="ens-tag normal">' + esc(CadOrg.planOf(o).label) + "</span>"
      : '<span class="ens-tag urgent">Read-only</span>';
    return '<a class="card ens-orgcard" href="home.html?org=' + o.id + '">' +
      '<div class="ens-h"><h2>' + esc(o.name) + "</h2>" + badge + "</div>" +
      '<div class="setsub">' + esc((r.role && r.role.name) || "Member") +
      (r.section ? " · " + esc(r.section) : "") + "</div></a>";
  }

  /* ── open communities ─────────────────────────────────────────────────
     Every other workspace is private by construction: you need a code
     somebody handed you. That leaves a first-time visitor with nothing to
     look at and no way to learn what a workspace even is. A community
     (0020_public_communities.sql) is one anybody may join with a single
     tap, so the answer to "what is this?" is a button rather than a
     paragraph. Projects that have not applied 0020 simply render nothing
     here — never a button that cannot work. */
  var communities = [];

  async function loadCommunities() {
    try {
      var rows = await CadOrg.rpc("list_public_orgs");
      var mine = {};
      CadOrg.orgs().forEach(function (r) { if (r.org) mine[r.org.id] = 1; });
      communities = (rows || []).filter(function (c) { return !mine[c.id]; });
    } catch (e) { communities = []; }      // 0020 not applied: no communities
  }

  function communityCard(c) {
    return '<div class="card"><div class="ens-h"><h2>' + esc(c.name) + "</h2>" +
      '<span class="ens-tag normal">Open to all</span></div>' +
      '<p class="setnote">' + esc(c.blurb || "An open Cadence community.") +
      (c.members ? " · " + c.members + (c.members === 1 ? " member" : " members") : "") + "</p>" +
      '<button class="tab" type="button" data-join-public="' + esc(c.id) + '">Join</button>' +
      '<p class="acct-msg" data-join-msg="' + esc(c.id) + '" role="status"></p></div>';
  }

  function render() {
    var orgs = CadOrg.orgs();
    main.innerHTML =
      '<h1 class="page">My Ensembles</h1>' +
      (orgs.length
        ? '<p class="lede">Your organizations\' private home base — announcements, groups, ' +
          "chat, calendar, files and day-to-day operations.</p>" +
          '<div class="ens-grid">' + orgs.map(card).join("") + "</div>" +
          '<h2 class="ens-subhead">Join another</h2>'
        : '<p class="lede">A workspace is where an organization runs its season — ' +
          "announcements, calendar, files, attendance. You are not in one yet.</p>") +
      '<div class="ens-grid">' +
        communities.map(communityCard).join("") +
        '<div class="card"><h2>Join with a code</h2>' +
          '<p class="setnote">Your director hands these out — a code, a link, or a QR at the ' +
          "first rehearsal.</p>" +
          '<form class="acct-form" id="joinForm"><input class="ctrl" id="joinCode" placeholder="Invite code" ' +
          'autocapitalize="characters" autocomplete="off" required>' +
          '<button class="tab" type="submit">Join workspace</button></form>' +
          '<p class="acct-msg" id="joinMsg" role="status"></p></div>' +
        '<div class="card"><h2>Start a workspace</h2>' +
          '<p class="setnote">For directors and staff. Free for 60 days with everything ' +
          "unlocked — a real season's worth of rehearsals before you decide.</p>" +
          '<form class="acct-form" id="newForm">' +
          '<input class="ctrl" id="newName" placeholder="Organization name" required maxlength="120">' +
          '<select class="ctrl" id="newType">' + TYPES.map(function (t) {
            return '<option value="' + t[0] + '">' + t[1] + "</option>"; }).join("") + "</select>" +
          '<button class="tab" type="submit">Create workspace →</button></form>' +
          '<p class="acct-msg" id="newMsg" role="status"></p></div>' +
      "</div>" +
      '<p class="ens-foot">Cadence Ensemble is the private side of Cadence. Your public ' +
      'scores, rankings and ensemble profile live over in <a href="../">public Cadence</a>.</p>';

    main.querySelectorAll("[data-join-public]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var id = btn.dataset.joinPublic;
        var msg = main.querySelector('[data-join-msg="' + id + '"]');
        btn.disabled = true;
        msg.className = "acct-msg"; msg.textContent = "Joining…";
        try {
          var orgId = await CadOrg.rpc("join_public_org", { p_org: id });
          location.href = "home.html?org=" + orgId;
        } catch (err) {
          btn.disabled = false;
          msg.className = "acct-msg err";
          msg.textContent = "Couldn't join: " + (err.message || "unknown error");
        }
      });
    });

    document.getElementById("joinForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = document.getElementById("joinMsg");
      msg.className = "acct-msg"; msg.textContent = "Checking…";
      try {
        var orgId = await CadOrg.rpc("redeem_org_invite", { p_code: document.getElementById("joinCode").value.trim() });
        location.href = "home.html?org=" + orgId;
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = /invite_invalid/.test(err.message || "")
          ? "That code isn't valid any more — ask your director for a fresh one."
          : "Couldn't join: " + (err.message || "unknown error");
      }
    });

    document.getElementById("newForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = document.getElementById("newMsg");
      var name = document.getElementById("newName").value.trim();
      msg.className = "acct-msg"; msg.textContent = "Creating…";
      try {
        var rows = await CadOrg.rest("organizations", {
          method: "POST",
          headers: { Prefer: "return=representation" },
          body: {
            name: name,
            slug: slugify(name) + "-" + Math.random().toString(36).slice(2, 6),
            org_type: document.getElementById("newType").value,
            created_by: CadAccount.user().id,
            billing_owner_user_id: CadAccount.user().id,
          },
        });
        location.href = "home.html?org=" + rows[0].id;
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = "Couldn't create that workspace: " + (err.message || "unknown error");
      }
    });

    /* Came in on an invite link — fill the box and say so. Always consume
       the park, even when the live URL already carried a code, so a stale
       one can never surface on a later visit. Nothing is focused: the only
       way to redeem is to deliberately choose "Join workspace". */
    var u = CadAccount.user();
    var parked = takeParkedInvite(u && u.email);
    var code = pendingInvite || parked;
    if (code) {
      document.getElementById("joinCode").value = code;
      var jm = document.getElementById("joinMsg");
      jm.className = "acct-msg ok";
      // #joinMsg sits under the form, so the box it describes is above it
      jm.textContent = "You've been invited — your code is in the box above. " +
        "Choose Join workspace to accept it.";
    }
  }

  CadOrg.start({ nav: "list", allowNoOrg: true }).then(function () {
    if (!CadAccount || !CadAccount.user()) { // sign-in gate already rendered
      if (pendingInvite) parkOnSignIn();
      return;
    }
    CadOrg.mountShell("list");
    render();                    // paint immediately; communities are a bonus
    loadCommunities().then(function () { if (communities.length) render(); });
  });
})();
</script>
</body>
</html>
