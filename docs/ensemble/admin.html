<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Cadence Ensemble</title>
<meta name="description" content="The director's control room: what needs attention today, access requests, roles and permissions, seasons and the audit log.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a3f6b">
<link rel="icon" href="../icons/icon-192.png">
<script>(function(){var r=document.documentElement;var t=localStorage.getItem("cad-theme");if(t)r.dataset.theme=t;
var fs=localStorage.getItem("cad-fontsize");if(fs&&fs!=="1")r.style.zoom=fs;})();</script>
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="ensemble.css">
<style>
/* Admin — page layout only. The rows, the drawer, the permission fieldset
   and the toast are shared with members.html and live in ensemble.css;
   colours are app.css tokens.

   Desktop shape: every tab here is "a list of things" beside "the form that
   makes another one", which is exactly what .dsk2.w75 is for. */
.adm-tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.adm-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 13px;
  padding: 13px 14px; text-decoration: none; display: block; color: inherit; }
.adm-tile:hover { background: var(--surface-2); text-decoration: none; }
.adm-tile b { display: block; font-size: 27px; font-weight: 800; color: var(--heading); line-height: 1.15; }
.adm-tile span { font-size: 12.5px; color: var(--muted); font-weight: 650; }
.adm-tile.alert b { color: var(--bad, #c92a2a); }
.adm-note { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }
.adm-log { display: grid; gap: 0; }
.adm-log-row { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
.adm-log-row:first-child { border-top: 0; }
.adm-log-row time { flex: none; width: 118px; color: var(--muted); font-size: 12px; font-weight: 650; }
.adm-log-row code { font-family: var(--mono); font-size: 12.5px; }
.adm-fieldrow { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.adm-fieldrow .ctrl { min-width: 0; flex: 1 1 140px; }
</style>
</head>
<body class="ens">
<div id="ensShell"></div>
<main id="ensMain" class="viz-root">
  <div class="loading">Loading…</div>
</main>

<script src="../vendor/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script src="../account.js"></script>
<script src="../analytics.js"></script>
<script src="core.js"></script>
<script src="people.js"></script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("ensMain");
  var esc = CadOrg.esc, P = CadPeople;
  var S = {
    org: null, ready: false, tab: "dashboard", roles: [], seasons: [], groups: [],
    requests: [], audit: [], forms: [], counts: {}, recentFiles: null,
    auditFilter: { action: "", since: "" },
  };

  function isAdmin() { return CadOrg.can("org.admin"); }
  function canMembers() { return CadOrg.canDo("member.manage"); }
  function canForms() { return CadOrg.canDo("form.manage"); }

  /* ── data export: the workspace's records, as plain CSV. Reads run under
     the caller's own RLS, so an export can never contain a row the person
     couldn't already see on screen. ───────────────────────────────────── */
  function csvCell(v) {
    var s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function downloadCsv(name, header, rows) {
    var body = [header].concat(rows).map(function (r) {
      return r.map(csvCell).join(",");
    }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + body], { type: "text/csv" }));
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  async function exportCsv(kind, btn) {
    var org = S.org, orig = btn.textContent;
    btn.disabled = true; btn.textContent = "Exporting…";
    try {
      if (kind === "roster") {
        var ms = await CadOrg.rest("org_members?select=display_name,section,instrument," +
          "leadership_title,grad_year,status,joined_at,role:org_roles!org_members_role_id_fkey(name)&org_id=eq." + org.id +
          "&order=display_name.asc&limit=5000");
        downloadCsv("roster.csv",
          ["Name", "Role", "Section", "Instrument", "Title", "Grad year", "Status", "Joined"],
          ms.map(function (m) {
            return [m.display_name, m.role && m.role.name, m.section, m.instrument,
                    m.leadership_title, m.grad_year, m.status,
                    (m.joined_at || "").slice(0, 10)];
          }));
      } else if (kind === "attendance") {
        var at = await CadOrg.rest("org_attendance?select=status,note,recorded_at," +
          "member:org_members!org_attendance_member_id_fkey(display_name)," +
          "ev:org_events!inner(org_id,title,starts_at)&ev.org_id=eq." + org.id +
          "&order=recorded_at.desc&limit=10000");
        downloadCsv("attendance.csv",
          ["Event", "Event date", "Member", "Status", "Note", "Recorded"],
          at.map(function (r) {
            return [r.ev && r.ev.title, r.ev && (r.ev.starts_at || "").slice(0, 10),
                    r.member && r.member.display_name, r.status, r.note,
                    (r.recorded_at || "").slice(0, 10)];
          }));
      } else if (kind === "posts") {
        var ps = await CadOrg.rest("posts?select=title,body,priority,pinned,requires_ack," +
          "created_at,author:org_members(display_name)&org_id=eq." + org.id +
          "&order=created_at.desc&limit=5000");
        downloadCsv("announcements.csv",
          ["Date", "Title", "Body", "Priority", "Pinned", "Requires ack", "Author"],
          ps.map(function (p) {
            return [(p.created_at || "").slice(0, 10), p.title, p.body, p.priority,
                    p.pinned, p.requires_ack, p.author && p.author.display_name];
          }));
      }
    } catch (e) {
      alert("Export failed — " + ((e && e.message) || "try again") + ".");
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  /* ── counts. Everything is a HEAD-style exact count (Prefer: count=exact,
     Range 0-0) so no dashboard ever downloads a table. Tables other phases
     own may not exist yet — softCount turns that into "—". ─────────────── */
  async function firstCount(paths) {
    for (var i = 0; i < paths.length; i++) {
      var n = await P.softCount(paths[i]);
      if (n !== null) return n;
    }
    return null;
  }

  async function loadCounts() {
    var org = S.org.id, now = new Date().toISOString();
    var c = {};
    c.members = await P.softCount("org_members?org_id=eq." + org + "&status=eq.active");
    c.requests = await P.softCount("org_access_requests?org_id=eq." + org + "&status=eq.pending");
    c.forms = await firstCount([
      "org_forms?org_id=eq." + org + "&is_open=is.true",
      "org_forms?org_id=eq." + org,
    ]);
    // owned by other phases — guessed table names, "—" when absent
    c.events = await firstCount([
      "org_events?org_id=eq." + org + "&starts_at=gte." + now,
      "org_calendar_events?org_id=eq." + org + "&starts_at=gte." + now,
    ]);
    // announcements still requiring acknowledgment — the real signal an
    // admin wants (posts.requires_ack on the actual posts table)
    c.acks = await P.softCount(
      "posts?org_id=eq." + org + "&requires_ack=is.true&archived=is.false");
    // org_attendance has no org_id (keyed by event+member), so scope it
    // through an inner join on the event; count concerning statuses only
    c.attendance = await P.softCount(
      "org_attendance?select=event_id,ev:org_events!inner(org_id)&ev.org_id=eq." + org +
      "&status=in.(absent,late)", "event_id,ev:org_events!inner(org_id)");
    S.counts = c;
  }

  async function loadRecentFiles() {
    var org = S.org.id;
    var paths = [
      "org_files?select=id,name,created_at&org_id=eq." + org + "&order=created_at.desc&limit=5",
      "org_documents?select=id,name,created_at&org_id=eq." + org + "&order=created_at.desc&limit=5",
    ];
    for (var i = 0; i < paths.length; i++) {
      try { return await CadOrg.rest(paths[i]); } catch (e) {}
    }
    return null;
  }

  async function load() {
    var org = S.org.id;
    S.roles = await CadOrg.rest("org_roles?select=*&org_id=eq." + org + "&order=sort.asc");
    S.seasons = await CadOrg.rest("org_seasons?select=*&org_id=eq." + org + "&order=created_at.desc");
    S.groups = await CadOrg.rest("org_groups?select=id,parent_id,name,kind,auto_role_keys," +
      "auto_sections,season_id&org_id=eq." + org + "&order=name.asc");
    try {
      S.requests = await CadOrg.rest("org_access_requests?select=*&org_id=eq." + org +
        "&order=created_at.desc&limit=100");
    } catch (e) { S.requests = []; }
    try {
      S.audit = await CadOrg.rest("org_audit_log?select=*&org_id=eq." + org +
        "&order=created_at.desc&limit=200");
    } catch (e) { S.audit = []; }
    try {
      S.forms = await CadOrg.rest("org_forms?select=id,title,kind,is_sensitive,is_open," +
        "closes_at,created_at,target_group_ids&org_id=eq." + org + "&order=created_at.desc");
    } catch (e) { S.forms = null; }
    S.recentFiles = await loadRecentFiles();
    await loadCounts();
  }

  function currentSeason() {
    return S.seasons.filter(function (s) { return s.is_current; })[0] || S.seasons[0] || null;
  }

  /* ── dashboard ────────────────────────────────────────────────────── */
  function n(v) { return v === null || v === undefined ? "—" : String(v); }

  function tile(href, value, label, alert) {
    return '<a class="adm-tile' + (alert && value ? " alert" : "") + '" href="' + href + '">' +
      "<b>" + n(value) + "</b><span>" + esc(label) + "</span></a>";
  }

  /* Billing has no tab of its own: core.js files it under Admin, and the
     More sheet that carries its link is a phone-only control. Admin is
     where a director already is, so this is billing's desktop front door —
     the number is what a director actually wants to know at a glance. */
  function canBilling() { return CadOrg.can("billing.manage") || CadOrg.can("org.admin"); }

  function billingTile() {
    var o = S.org, plan = CadOrg.planOf(o), days = CadOrg.trialDaysLeft(o);
    var trial = o.status === "trialing" && days !== null;
    var big = trial ? String(days) : plan.price ? "$" + plan.price : "—";
    var label = trial ? "Trial days left · billing"
      : plan.label + " · " + String(o.status || "").replace("_", " ");
    return tile("billing.html", big, label, !CadOrg.isWritable(o));
  }

  function dashboardHtml() {
    var c = S.counts;
    // Polls and Tasks are sold on the plan cards and have schema in 0007, but
    // no screen builds one yet, so neither gets a quick action — a shortcut
    // to a feature that isn't there is worse than no shortcut. They come back
    // when the surfaces do.
    var quick = [
      ["Post announcement", "feed.html"],
      ["Create event", "calendar.html"],
      ["Upload file", "files.html"],
      ["Add member", "members.html#invites"],
      ["Create group", "members.html#groups"],
      ["Create form", "admin.html#forms"],
    ];
    if (canBilling()) quick.push(["Plan & billing", "billing.html"]);
    return '<div class="card"><div class="ens-h"><h2>Today</h2>' +
        '<span class="setsub">' + esc(CadOrg.planOf(S.org).label) + " · " + esc(S.org.status) + "</span></div>" +
        '<div class="adm-tiles">' +
          tile("members.html", c.members, "Active members") +
          tile("feed.html", c.acks, "Awaiting acknowledgment", true) +
          tile("calendar.html", c.events, "Upcoming events") +
          tile("admin.html#forms", c.forms, "Open forms") +
          tile("calendar.html", c.attendance, "Attendance alerts", true) +
          tile("admin.html#requests", c.requests, "Pending access requests", true) +
          (canBilling() ? billingTile() : "") +
        "</div>" +
        '<p class="adm-note">A dash means that part of the workspace hasn\'t been set up yet — ' +
        "the screen that owns it will fill this in.</p></div>" +

      '<div class="ens-grid" style="margin-top:14px">' +
        '<div class="card"><div class="ens-h"><h2>Your data, yours to take</h2></div>' +
          '<div class="ens-quick">' +
            '<button class="tab" type="button" data-export="roster">Roster CSV</button>' +
            '<button class="tab" type="button" data-export="attendance">Attendance CSV</button>' +
            '<button class="tab" type="button" data-export="posts">Announcements CSV</button>' +
          "</div>" +
          '<p class="adm-note">Everything your workspace owns, downloadable any time — leaving ' +
          "Cadence never means losing your records. Drill dot books print from the drill " +
          "viewer; files download from the library.</p></div>" +
        '<div class="card"><div class="ens-h"><h2>Quick actions</h2></div>' +
          '<div class="ens-quick">' + quick.map(function (q) {
            return '<a class="tab" href="' + q[1] + '">' + esc(q[0]) + "</a>"; }).join("") +
          "</div>" +
          (CadOrg.isWritable(S.org) ? "" :
            '<p class="ppl-warn">This workspace is read-only — these open, but saving is paused ' +
            'until the subscription is reactivated. <a href="billing.html">Billing →</a></p>') + "</div>" +

        '<div class="card"><div class="ens-h"><h2>Recent files</h2>' +
          '<a href="files.html">All files →</a></div>' +
          (S.recentFiles === null
            ? '<div class="empty">The files workspace isn\'t set up yet.</div>'
            : S.recentFiles.length
              ? S.recentFiles.map(function (f) {
                  return '<div class="ens-item"><div style="flex:1"><b>' +
                    esc(f.name || "Untitled") + '</b><div class="ens-sub">' +
                    esc(P.relTime(f.created_at)) + "</div></div></div>"; }).join("")
              : '<div class="empty">No files uploaded yet.</div>') + "</div>" +

        '<div class="card span2"><div class="ens-h"><h2>Recent admin activity</h2>' +
          '<a href="admin.html#audit">Full audit log →</a></div>' +
          (S.audit.length ? '<div class="adm-log">' + S.audit.slice(0, 8).map(auditRowHtml).join("") + "</div>"
            : '<div class="empty">Nothing logged yet.</div>') + "</div>" +
      "</div>";
  }

  function auditRowHtml(a) {
    return '<div class="adm-log-row"><time>' + esc(P.fmtDateTime(a.created_at)) + "</time>" +
      "<div><code>" + esc(a.action) + "</code>" +
      (a.target_type ? ' <span class="ppl-sub" style="display:inline">' + esc(a.target_type) + "</span>" : "") +
      (a.detail && Object.keys(a.detail).length
        ? '<div class="ppl-sub">' + esc(JSON.stringify(a.detail).slice(0, 160)) + "</div>" : "") +
      "</div></div>";
  }

  /* ── access requests ──────────────────────────────────────────────── */
  function requestsHtml() {
    if (!canMembers()) {
      return '<div class="card"><div class="empty">Reviewing access requests needs ' +
        "<code>member.manage</code>.</div></div>";
    }
    var pending = S.requests.filter(function (r) { return r.status === "pending"; });
    var done = S.requests.filter(function (r) { return r.status !== "pending"; }).slice(0, 20);
    return '<div class="dsk2 w75">' +
      '<div class="card"><div class="ens-h"><h2>Pending requests</h2>' +
        '<span class="setsub">' + pending.length + " waiting</span></div>" +
        '<p class="setnote">Approving a request creates that person\'s member row with the role ' +
        "you choose. Nothing can arrive here yet: no screen in Cadence lets someone ask to " +
        'join a workspace, so the way in today is an invite — <a href="members.html#invites">' +
        "send a code or a link</a>. This list starts filling the moment request-to-join ships.</p>" +
        (pending.length ? pending.map(function (r) {
          return '<div class="ens-item" data-req="' + esc(r.id) + '"><div style="flex:1;min-width:0">' +
            "<b>" + esc(r.requested_kind || "member") + " request</b>" +
            '<div class="ens-sub">' + esc(r.message || "No message") + " · " +
            esc(P.relTime(r.created_at)) + "</div>" +
            '<div class="ppl-actions">' +
              '<select class="ctrl" data-role-for="' + esc(r.id) + '">' +
                P.roleOptionsHtml(S.roles, defaultRoleId()) + "</select>" +
              '<input class="ctrl" data-note-for="' + esc(r.id) + '" placeholder="Note (optional)" maxlength="200">' +
              '<button class="tab on" type="button" data-approve="' + esc(r.id) + '">Approve</button>' +
              '<button class="tab" type="button" data-reject="' + esc(r.id) + '">Reject</button>' +
            "</div></div></div>"; }).join("")
          : '<div class="empty">No one is waiting.</div>') + "</div>" +
      '<div class="card"><h2>Recently reviewed</h2>' +
        (done.length ? done.map(function (r) {
          return '<div class="ens-item"><div style="flex:1"><b>' + esc(r.status) + "</b>" +
            '<div class="ens-sub">' + esc(r.reviewer_note || "") + " · " +
            esc(P.fmtDate(r.reviewed_at || r.created_at)) + "</div></div></div>"; }).join("")
          : '<div class="empty">Nothing reviewed yet.</div>') + "</div></div>";
  }

  function defaultRoleId() {
    var r = S.roles.filter(function (x) { return x.key === "member"; })[0] || S.roles[0];
    return r ? r.id : "";
  }

  async function approveRequest(id, roleId, note) {
    var req = S.requests.filter(function (r) { return r.id === id; })[0];
    if (!req) return;
    var season = currentSeason();
    // 1) create the member (the request row itself carries the user id)
    await CadOrg.rest("org_members", { method: "POST",
      headers: { Prefer: "resolution=merge-duplicates" },
      body: { org_id: S.org.id, user_id: req.user_id, role_id: roleId || defaultRoleId(),
        status: "active", season_id: season ? season.id : null } });
    // 2) mark the request approved
    await CadOrg.rest("org_access_requests?id=eq." + id, { method: "PATCH",
      body: { status: "approved", reviewed_at: new Date().toISOString(),
        reviewer_note: note || null } });
    await CadOrg.log("access_request.approved", "access_request", id, { user_id: req.user_id });
  }

  /* ── roles ────────────────────────────────────────────────────────── */
  function rolesHtml() {
    if (!canMembers()) {
      return '<div class="card"><div class="empty">Editing roles needs <code>member.manage</code>.</div></div>';
    }
    return '<div class="dsk2 w75">' +
      '<div class="card"><div class="ens-h"><h2>Roles &amp; permissions</h2>' +
        '<span class="setsub">' + S.roles.length + " roles</span></div>" +
        '<p class="setnote">Every role is editable, including the seeded ones. Add your own — ' +
        "Battery Staff, Prop Crew, Hospitality — and give each exactly the permissions it needs.</p>" +
        '<div class="ppl-list">' + S.roles.map(function (r) {
          var perms = r.permissions || [];
          return '<button class="ppl-row" type="button" data-role="' + esc(r.id) + '">' +
            '<span class="ppl-main"><b>' + esc(r.name) + "</b>" +
            '<span class="ppl-sub"><code>' + esc(r.key) + "</code> · " + esc(r.kind) + " · " +
            (perms.indexOf("org.admin") >= 0 ? "full admin" : perms.length + " permissions") +
            "</span></span>" +
            (r.is_system ? '<span class="ens-tag normal">Default</span>' : "") + "</button>";
        }).join("") + "</div></div>" +
      '<div class="card"><h2>New role</h2>' +
        '<form class="acct-form" id="roleForm">' +
          '<input class="ctrl" id="roleName" placeholder="Role name (Battery Staff)" required maxlength="60">' +
          '<select class="ctrl" id="roleKind">' + P.ROLE_KINDS.map(function (k) {
            return '<option value="' + k[0] + '">' + k[1] + "</option>"; }).join("") + "</select>" +
          '<button class="tab on" type="submit">Create role</button></form>' +
        '<p class="acct-msg" id="roleMsg" role="status"></p></div></div>';
  }

  function openRole(id) {
    var r = S.roles.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    var d = P.drawer("<h3>" + esc(r.name) + "</h3>" +
      '<div class="setsub" style="margin-bottom:12px"><code>' + esc(r.key) + "</code>" +
      (r.is_system ? " · seeded default (still editable)" : " · custom role") + "</div>" +
      '<form id="roleEdit"><div class="ppl-2">' +
        '<label class="ppl-field"><span>Name</span><input class="ctrl" id="rName" value="' + esc(r.name) + '" maxlength="60"></label>' +
        '<label class="ppl-field"><span>Kind</span><select class="ctrl" id="rKind">' +
          P.ROLE_KINDS.map(function (k) {
            return '<option value="' + k[0] + '"' + (r.kind === k[0] ? " selected" : "") + ">" + k[1] + "</option>";
          }).join("") + "</select></label></div>" +
      "<h4>Permissions</h4>" +
      '<div id="rPerms">' + P.permissionEditorHtml(r.permissions || []) + "</div>" +
      '<div class="ppl-actions"><button class="tab on" type="submit">Save role</button>' +
      (r.is_system ? "" : '<button class="tab" type="button" id="rDelete">Delete role</button>') +
      '<span class="acct-msg" id="rMsg" role="status"></span></div></form>' +
      '<p class="ppl-warn">Changing a role changes it for everyone who holds it, immediately. ' +
      "<code>student.info</code> unlocks medical form submissions — grant it deliberately.</p>");

    d.el.querySelector("#roleEdit").addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = d.el.querySelector("#rMsg");
      msg.className = "acct-msg"; msg.textContent = "Saving…";
      var perms = P.readPermissionEditor(d.el.querySelector("#rPerms"));
      try {
        await CadOrg.rest("org_roles?id=eq." + r.id, { method: "PATCH", body: {
          name: d.el.querySelector("#rName").value.trim(),
          kind: d.el.querySelector("#rKind").value,
          permissions: perms } });
        await CadOrg.log("role.updated", "role", r.id, { permissions: perms });
        msg.className = "acct-msg ok"; msg.textContent = "Saved.";
        await refresh();
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = "Couldn't save: " + (err.message || "unknown error");
      }
    });

    var del = d.el.querySelector("#rDelete");
    if (del) del.addEventListener("click", async function () {
      if (!confirm("Delete the role “" + r.name + "”? Members holding it must be moved first.")) return;
      try {
        await CadOrg.rest("org_roles?id=eq." + r.id, { method: "DELETE" });
        await CadOrg.log("role.deleted", "role", r.id, { name: r.name });
        P.toast("Role deleted."); d.close(); await refresh();
      } catch (err) {
        P.toast("Couldn't delete — members probably still hold it.", true);
      }
    });
  }

  /* ── seasons ──────────────────────────────────────────────────────── */
  function seasonsHtml() {
    if (!isAdmin()) {
      return '<div class="card"><div class="empty">Season management needs <code>org.admin</code>.</div></div>';
    }
    return '<div class="dsk2 w75">' +

  async function copyGroupsToSeason(fromSeasonId, toSeasonId) {
    var src = S.groups.filter(function (g) { return g.season_id === fromSeasonId; });
    if (!src.length) return 0;
    // pass 1: create every group without a parent, remembering old → new ids
    var created = await CadOrg.rest("org_groups", { method: "POST",
      headers: { Prefer: "return=representation" },
      body: src.map(function (g) {
        return { org_id: S.org.id, name: g.name, kind: g.kind,
          auto_role_keys: g.auto_role_keys || [], auto_sections: g.auto_sections || [],
          season_id: toSeasonId, created_by: CadAccount.user().id }; }) });
    var mapByName = {};
    created.forEach(function (g) { mapByName[g.name] = g.id; });
    // pass 2: rebuild nesting by name (names are unique within a season in practice)
    var withParents = src.filter(function (g) { return g.parent_id; });
    for (var i = 0; i < withParents.length; i++) {
      var g = withParents[i];
      var parent = src.filter(function (x) { return x.id === g.parent_id; })[0];
      if (!parent || !mapByName[parent.name] || !mapByName[g.name]) continue;
      try {
        await CadOrg.rest("org_groups?id=eq." + mapByName[g.name], { method: "PATCH",
          body: { parent_id: mapByName[parent.name] } });
      } catch (e) {}
    }
    return created.length;
  }

  /* ── page ─────────────────────────────────────────────────────────── */
  var TABS = [["dashboard", "Dashboard"], ["requests", "Requests"], ["roles", "Roles"],
    ["seasons", "Seasons"], ["forms", "Forms"], ["audit", "Audit log"]];

  /* The dashboard tiles and quick actions are ordinary links to
     admin.html#tab. A same-document fragment link never reloads the page,
     so reading the hash once at boot left them changing the URL and nothing
     else. One listener routes them — and the back button with them. Tab
     buttons use replaceState, which fires nothing, so this never doubles up.

     Two things the first version of this got wrong. Going BACK to the
     hashless entry is the common case (the tab buttons replaceState a hash
     in, so the entry you arrived on is usually the only one without one):
     an unrecognised or empty hash has to mean "dashboard", not "leave
     whatever pane is on screen and let the URL lie". And the listener may
     only paint once the page is actually open to this person — S.org is
     set before the permission check and on the load()-failure path, so
     it is not that signal; S.ready is, and nothing sets it until both. */
  function tabFromHash() {
    var hash = (location.hash || "").replace("#", "");
    return TABS.some(function (t) { return t[0] === hash; }) ? hash : null;
  }
  window.addEventListener("hashchange", function () {
    if (!S.ready) return;
    var t = tabFromHash() || "dashboard";
    if (t === S.tab) return;
    S.tab = t;
    render();
    window.scrollTo(0, 0);
  });

  function render() {
    main.innerHTML =
      '<h1 class="page">Admin</h1>' +
      '<p class="lede">' + esc(S.org.name) + " — what needs attention, who is asking to join, " +
      "what each role may do, and every administrative change that has been made.</p>" +
      '<div class="subtabs" role="tablist">' + TABS.map(function (t) {
        return '<button class="tab' + (S.tab === t[0] ? " on" : "") + '" type="button" data-tab="' +
          t[0] + '">' + t[1] + "</button>"; }).join("") + "</div>" +
      '<div class="ppl-pane' + (S.tab === "dashboard" ? " on" : "") + '" id="paneDashboard">' + dashboardHtml() + "</div>" +
      '<div class="ppl-pane' + (S.tab === "requests" ? " on" : "") + '" id="paneRequests">' + requestsHtml() + "</div>" +
      '<div class="ppl-pane' + (S.tab === "roles" ? " on" : "") + '" id="paneRoles">' + rolesHtml() + "</div>" +
      '<div class="ppl-pane' + (S.tab === "seasons" ? " on" : "") + '" id="paneSeasons">' + seasonsHtml() + "</div>" +
      '<div class="ppl-pane' + (S.tab === "forms" ? " on" : "") + '" id="paneForms">' + formsHtml() + "</div>" +
      '<div class="ppl-pane' + (S.tab === "audit" ? " on" : "") + '" id="paneAudit">' + auditHtml() + "</div>";

    main.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.tab = b.dataset.tab;
        try { history.replaceState(null, "", "#" + S.tab); } catch (e) {}
        render();
      });
    });
    main.querySelectorAll("[data-export]").forEach(function (b) {
      b.addEventListener("click", function () { exportCsv(b.dataset.export, b); });
    });

    wireRequests(main.querySelector("#paneRequests"));
    wireRoles(main.querySelector("#paneRoles"));
    wireSeasons(main.querySelector("#paneSeasons"));
    wireForms(main.querySelector("#paneForms"));
    wireAudit(main.querySelector("#paneAudit"));
  }

  function wireRequests(root) {
    root.addEventListener("click", async function (e) {
      var t = e.target;
      if (!t.dataset) return;
      var id = t.dataset.approve || t.dataset.reject;
      if (!id) return;
      var note = root.querySelector('[data-note-for="' + id + '"]');
      t.disabled = true;
      try {
        if (t.dataset.approve) {
          var sel = root.querySelector('[data-role-for="' + id + '"]');
          await approveRequest(id, sel ? sel.value : null, note ? note.value.trim() : "");
          P.toast("Approved — they're on the roster.");
        } else {
          await CadOrg.rest("org_access_requests?id=eq." + id, { method: "PATCH", body: {
            status: "rejected", reviewed_at: new Date().toISOString(),
            reviewer_note: (note && note.value.trim()) || null } });
          await CadOrg.log("access_request.rejected", "access_request", id);
          P.toast("Request rejected.");
        }
        await refresh();
      } catch (err) {
        t.disabled = false;
        P.toast("Couldn't do that: " + (err.message || "error"), true);
      }
    });
  }

  function wireRoles(root) {
    root.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("[data-role]");
      if (b) openRole(b.dataset.role);
    });
    var form = root.querySelector("#roleForm");
    if (form) form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = root.querySelector("#roleMsg");
      var name = root.querySelector("#roleName").value.trim();
      var key = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
      msg.className = "acct-msg"; msg.textContent = "Creating…";
      try {
        var rows = await CadOrg.rest("org_roles", { method: "POST",
          headers: { Prefer: "return=representation" },
          body: { org_id: S.org.id, key: key, name: name,
            kind: root.querySelector("#roleKind").value,
            permissions: ["announce.view", "file.view"], sort: 200 } });
        await CadOrg.log("role.created", "role", rows[0].id, { key: key });
        msg.className = "acct-msg ok"; msg.textContent = "Created — open it to set permissions.";
        await refresh();
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = "Couldn't create that role: " + (err.message || "unknown error");
      }
    });
  }

  function wireSeasons(root) {
    root.addEventListener("click", async function (e) {
      var t = e.target;
      if (!t.dataset) return;
      try {
        if (t.dataset.switch) {
          await CadOrg.rest("org_seasons?org_id=eq." + S.org.id + "&is_current=is.true",
            { method: "PATCH", body: { is_current: false } });
          await CadOrg.rest("org_seasons?id=eq." + t.dataset.switch,
            { method: "PATCH", body: { is_current: true } });
          await CadOrg.log("season.switched", "season", t.dataset.switch);
          P.toast("Current season changed."); await refresh();
        } else if (t.dataset.archive || t.dataset.unarchive) {
          var id = t.dataset.archive || t.dataset.unarchive;
          await CadOrg.rest("org_seasons?id=eq." + id, { method: "PATCH",
            body: { archived: !!t.dataset.archive } });
          await CadOrg.log(t.dataset.archive ? "season.archived" : "season.unarchived", "season", id);
          P.toast("Season updated."); await refresh();
        }
      } catch (err) { P.toast("Couldn't update the season: " + (err.message || "error"), true); }
    });

    var form = root.querySelector("#seasonForm");
    if (form) form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = root.querySelector("#sMsg");
      msg.className = "acct-msg"; msg.textContent = "Creating…";
      var from = currentSeason();
      var makeCurrent = root.querySelector("#sCurrent").checked;
      try {
        if (makeCurrent) {
          await CadOrg.rest("org_seasons?org_id=eq." + S.org.id + "&is_current=is.true",
            { method: "PATCH", body: { is_current: false } });
        }
        var rows = await CadOrg.rest("org_seasons", { method: "POST",
          headers: { Prefer: "return=representation" },
          body: { org_id: S.org.id, name: root.querySelector("#sName").value.trim(),
            starts_on: root.querySelector("#sStart").value || null,
            ends_on: root.querySelector("#sEnd").value || null,
            is_current: makeCurrent } });
        var copied = 0;
        if (root.querySelector("#sCopy").checked && from) {
          copied = await copyGroupsToSeason(from.id, rows[0].id);
        }
        await CadOrg.log("season.created", "season", rows[0].id,
          { name: rows[0].name, groups_copied: copied });
        msg.className = "acct-msg ok";
        msg.textContent = "Season created" + (copied ? " with " + copied + " groups copied." : ".");
        await refresh();
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = "Couldn't create that season: " + (err.message || "unknown error");
      }
    });
  }

  function wireForms(root) {
    root.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("[data-form]");
      if (b) openFormSubmissions(b.dataset.form);
    });
    var fields = root.querySelector("#fFields");
    var add = root.querySelector("#fAddField");
    if (add && fields) {
      fields.insertAdjacentHTML("beforeend", fieldRowHtml());
      add.addEventListener("click", function () {
        fields.insertAdjacentHTML("beforeend", fieldRowHtml());
      });
      fields.addEventListener("click", function (e) {
        if (e.target.dataset && e.target.dataset.f === "remove") {
          e.target.closest(".adm-fieldrow").remove();
        }
      });
      fields.addEventListener("change", function (e) {
        if (e.target.dataset && e.target.dataset.f === "type") {
          syncFieldRow(e.target.closest(".adm-fieldrow"));
        }
      });
    }
    var kind = root.querySelector("#fKind");
    if (kind) kind.addEventListener("change", function () {
      if (kind.value === "medical") root.querySelector("#fSensitive").value = "true";
    });

    var form = root.querySelector("#formForm");
    if (form) form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = root.querySelector("#fMsg");
      msg.className = "acct-msg"; msg.textContent = "Creating…";
      var me = CadOrg.member();
      var groupSel = root.querySelector("#fGroups");
      var targets = groupSel
        ? Array.prototype.slice.call(groupSel.querySelectorAll("option:checked"))
            .map(function (o) { return o.value; })
        : [];
      try {
        var rows = await CadOrg.rest("org_forms", { method: "POST",
          headers: { Prefer: "return=representation" },
          body: { org_id: S.org.id,
            title: root.querySelector("#fTitle").value.trim(),
            description: root.querySelector("#fDesc").value.trim() || null,
            kind: root.querySelector("#fKind").value,
            target_group_ids: targets,
            is_sensitive: root.querySelector("#fSensitive").value === "true",
            closes_at: root.querySelector("#fCloses").value
              ? new Date(root.querySelector("#fCloses").value).toISOString() : null,
            created_by_member: me ? me.id : null } });
        var defs = Array.prototype.slice.call(root.querySelectorAll(".adm-fieldrow"))
          .map(function (r, i) {
            var label = r.querySelector('[data-f="label"]').value.trim();
            if (!label) return null;
            var opts = r.querySelector('[data-f="options"]').value.trim();
            var type = r.querySelector('[data-f="type"]').value;
            return { form_id: rows[0].id, label: label,
              field_type: type,
              options: opts ? opts.split(",").map(function (s) { return s.trim(); }).filter(Boolean) : [],
              // a required file field can never be answered — see syncFieldRow
              required: r.querySelector('[data-f="required"]').checked && type !== "file",
              sort: (i + 1) * 10 };
          }).filter(Boolean);
        if (defs.length) await CadOrg.rest("org_form_fields", { method: "POST", body: defs });
        await CadOrg.log("form.created", "form", rows[0].id,
          { title: rows[0].title, sensitive: rows[0].is_sensitive, fields: defs.length });
        msg.className = "acct-msg ok"; msg.textContent = "Form created.";
        await refresh();
      } catch (err) {
        msg.className = "acct-msg err";
        msg.textContent = "Couldn't create that form: " + (err.message || "unknown error");
      }
    });
  }

  function wireAudit(root) {
    var a = root.querySelector("#aAction"), s = root.querySelector("#aSince");
    if (a) a.addEventListener("change", function () { S.auditFilter.action = a.value; render(); });
    if (s) s.addEventListener("change", function () { S.auditFilter.since = s.value; render(); });
  }

  async function refresh() {
    try { await load(); } catch (e) {}
    render();
  }

  CadOrg.start({ nav: "admin" }).then(async function (org) {
    if (!org) return;
    S.org = org;
    if (!(CadOrg.can("org.admin") || CadOrg.can("member.manage") || CadOrg.can("audit.view"))) {
      main.innerHTML = '<h1 class="page">Admin</h1><div class="card"><div class="empty">' +
        "This area is for directors and staff who manage the roster.</div></div>";
      return;
    }
    var hash = tabFromHash();
    if (hash) S.tab = hash;
    try { await load(); } catch (e) {
      main.innerHTML = '<div class="card"><div class="empty">Couldn\'t load the admin data. ' +
        "If this is a fresh install, migrations 0005 and 0009 may not be applied yet.</div></div>";
      return;
    }
    S.ready = true;   // only now may a hash change paint the Admin shell
    render();
  });
})();
</script>
</body>
</html>
