# WGI live data ingest via CompetitionSuite (same platform as the DCI scrape).
# Run "discover" first — it writes data/wgi_probe.json as an artifact so the
# organization GUID and season/competition shapes can be verified before the
# first real ingest. "ingest" only commits data that passes validation; a
# failed run never erases anything.
#
# WGI publishes live scores only through its directors-only portal, so until
# access is granted the apps run on the championship record — every view is
# derived from it by scripts/build_wgi_datasets.py — plus the official
# schedule (see docs/family/BOARD-CONTRACT.md). This job is what turns the
# real feed on the day it opens: once seasons/<year>.json carries scored
# results, build_wgi_datasets.py stands down (refusal_reason) and
# gen_family_data.py re-derives everything from the fuller data instead.
name: WGI ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (probe only) or ingest (write data)"
        type: choice
        options: [discover, ingest]
        default: discover
      year:
        description: "Season year (blank = current year)"
        default: ""
  schedule:
    # Weekly during the WGI season (Jan–Apr), Mondays 06:12 UTC
    - cron: "12 6 * 1-4 1"

permissions:
  contents: write

concurrency:
  group: wgi-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run WGI scraper
        env:
          MODE: ${{ github.event.inputs.mode || 'ingest' }}
          YEAR_IN: ${{ github.event.inputs.year }}
          PYTHONPATH: scraper
        run: |
          # scheduled runs carry no inputs — a hardcoded default would keep
          # re-ingesting a season that has already ended
          YEAR="${YEAR_IN:-$(date -u +%Y)}"
          python scraper/scrape_wgi.py --$MODE --year "$YEAR" || echo "::warning::wgi $MODE did not complete cleanly — see probe artifact"
      - name: Normalise the ingested datasets
        if: ${{ (github.event.inputs.mode || 'ingest') == 'ingest' }}
        run: |
          # CompetitionSuite serves HTML-escaped ensemble names, and the app's
          # router only resolves slugOf() slugs — this pass decodes the names,
          # re-derives corps_index + the per-ensemble logs from the season
          # files, and gives every indexed ensemble a profile file. It also
          # picks the derivation source: champion record until real per-show
          # results land, season files afterwards.
          python3 scripts/gen_family_data.py
          # every derived row must still trace back to a real published result
          node scripts/test_wgi_datasets.js
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-probes
          path: data/*_probe.json
          if-no-files-found: ignore
      - name: Commit ingested data
        run: |
          git config user.name "cadence-labs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/wgi/*/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "WGI data ingest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do git push && break; git pull --rebase && sleep $((i*2)); done
