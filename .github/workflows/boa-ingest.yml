# BOA live data ingest from the official recap PDFs on
# marching.musicforall.org (modeled on wgi-ingest.yml). Run "discover" first —
# it writes data/boa_probe2.json as an artifact listing every event and the
# recap PDFs it links, so the season's shape can be verified before ingesting.
# "ingest" only commits data that passes validation (>=2 events, >=30 rows,
# scores 40..100); a failed run never erases anything, and the demo generator
# skips docs/boa once a LIVE marker exists.
name: BOA ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (probe only) or ingest (write data)"
        type: choice
        options: [discover, ingest]
        default: discover
      year:
        description: "Season year (blank = current year)"
        default: ""
  schedule:
    # Weekly during the BOA autumn season (Sep–Nov), Mondays 06:23 UTC
    - cron: "23 6 * 9-11 1"

permissions:
  contents: write

concurrency:
  group: boa-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run BOA scraper
        env:
          MODE: ${{ github.event.inputs.mode || 'ingest' }}
          YEAR: ${{ github.event.inputs.year }}
          PYTHONPATH: scraper
        run: |
          [ -n "$YEAR" ] || YEAR=$(date -u +%Y)
          python scraper/scrape_boa.py --$MODE --year "$YEAR" || echo "::warning::boa $MODE did not complete cleanly — see probe artifact"
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boa-probe
          path: data/boa_probe2.json
          if-no-files-found: ignore
      - name: Commit ingested data
        run: |
          git config user.name "cadence-labs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/boa/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "BOA data ingest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do git push && break; git pull --rebase && sleep $((i*2)); done
