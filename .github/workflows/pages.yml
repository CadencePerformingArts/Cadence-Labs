name: Deploy site

on:
  push:
    branches: [main]
    paths: ["docs/**", "apps/**", "packages/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
  # Retained for infrequent backfill/history jobs. The frequent data updater
  # dispatches this workflow asynchronously so Pages cannot hold its lock.
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, NOT the run's trigger sha — when called after a data
      # update, the trigger sha predates the data commit the update job
      # just pushed, and deploying it would publish one-cycle-stale scores
      - uses: actions/checkout@v4
        with:
          ref: main
      # Runs FIRST so a repo where Pages cannot be enabled (private repo on a
      # free plan) fails in seconds instead of after a five-minute app build —
      # cron-dispatched deploys would otherwise burn the Actions quota.
      - name: Enable & configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The family apps are derived from the DCI engine + generated datasets —
      # rebuild them so they always match the deployed app.js. Asserted
      # transforms fail the deploy on drift. (The React Native prototype is
      # deliberately NOT published — the site is the static app family only.)
      - name: Build Cadence family apps
        run: |
          python3 scripts/build_family_engine.py
          python3 scripts/gen_family_data.py
          python3 scripts/gen_family_pages.py
      - name: Compose site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
