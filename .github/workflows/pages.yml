name: Deploy site

on:
  push:
    branches: [main]
    paths: ["docs/**", "apps/**", "packages/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
  # Retained for infrequent backfill/history jobs. The frequent data updater
  # dispatches this workflow asynchronously so Pages cannot hold its lock.
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, NOT the run's trigger sha — when called after a data
      # update, the trigger sha predates the data commit the update job
      # just pushed, and deploying it would publish one-cycle-stale scores
      - uses: actions/checkout@v4
        with:
          ref: main
      # Runs FIRST so a repo where Pages cannot be enabled (private repo on a
      # free plan) fails in seconds instead of after a five-minute app build —
      # cron-dispatched deploys would otherwise burn the Actions quota.
      - name: Enable & configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the in-app DCI snapshot from the latest scraped data so the
      # deployed Cadence app tracks the twice-daily pipeline automatically.
      - name: Regenerate DCI snapshot
        run: python3 scripts/gen_dci_snapshot.py
      - name: Build Cadence web app
        run: npx expo export --platform web
        working-directory: apps/cadence
      - name: Compose site (legacy dashboard at /, Cadence app at /app/)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/app
          cp -r apps/cadence/dist/. _site/app/
          # SPA fallback: unknown paths (e.g. /app/ensemble/dci/bluecoats)
          # fall through to the app shell, which routes client-side.
          cp _site/app/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
